 node(tag,text,parent){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e}function render(){form.replaceChildren();document.getElementById('result').replaceChildren();questions=[];let n=0;for(let group of ['A','B','C','D','E','F']){let sec=node('section',undefined,form);node('h2',titles[group],sec);for(let q of shuffle(bank.filter(x=>x.g===group))){let i=n++;questions.push(q);let box=node('div',undefined,sec);box.className='card';node('strong',`${i+1}. ${q.q} (${q.m} markah)`,box);if(group==='D'){for(let [k,pair] of q.pairs.entries()){let l=node('label',pair[0]+' — ',box),s=node('select',undefined,l);s.name=`q${i}_${k}`;let blank=node('option','Pilih jawapan',s);blank.value='';for(let o of shuffle(q.pairs.map(x=>x[1]))){node('option',o,s)}}}else if(group==='F'){let s=node('select',undefined,box);s.name='q'+i;node('option','Pilih jawapan',s).value='';for(let o of shuffle(q.o))node('option',o,s)}else{for(let o of (group==='B'||group==='C'?q.o:shuffle(q.o))){let l=node('label',undefined,box),inp=node('input',undefined,l);inp.type=group==='E'?'checkbox':'radio';inp.name='q'+i;inp.value=o;l.append(' '+o)}}}}let b=node('button','Semak jawapan',form);b.type='submit';}form.onsubmit=e=>{e.preventDefault();let data=new FormData(form),score=0,wrong=[],empty=0;questions.forEach((q,i)=>{let chosen=q.g==='D'?q.pairs.map((_,k)=>data.get(`q${i}_${k}`)||''):data.getAll('q'+i);let correct=q.g==='D'?q.pairs.map(x=>x[1]):q.a;let points=0;if(!chosen.length||chosen.includes(''))empty++;if(q.g==='D')points=chosen.filter((v,k)=>v===correct[k]).length;else if(q.g==='E')points=chosen.length===correct.length&&correct.every(x=>chosen.includes(x))?3:0;else points=chosen[0]===correct[0]?q.m:0;score+=points;if(points<q.m)wrong.push({q,i,chosen,correct,points})});if(empty&&!confirm(`${empty} soalan belum lengkap. Hantar juga?`))return;let r=document.getElementById('result');r.replaceChildren();let h=node('h1',score>=85?'HEBATNYA KAMU!':score>=70?'Bagus! Teruskan usaha!':'Jom cuba lagi, kamu pasti boleh!',r);if(score>=85){h.className='celebrate';for(let i=0;i<24;i++){let heart=node('span','💗',document.body);heart.className='heart';heart.style.left=Math.random()*95+'vw';heart.style.fontSize=18+Math.random()*30+'px';heart.style.animationDelay=Math.random()*2+'s';setTimeout(()=>heart.remove(),5500)}}node('h2',score+' / 100 markah',r);node('p',wrong.length?'Semakan jawapan yang belum tepat:':'Semua jawapan tepat!',r);for(let w of wrong){let d=node('div',undefined,r);d.className='wrong';node('strong',`${w.i+1}. ${w.q.q} (${w.points}/${w.q.m})`,d);node('p','Jawapan kamu: '+(w.chosen.map(x=>x||'Tidak dijawab').join(' | ')||'Tidak dijawab'),d);node('p','Jawapan betul: '+w.correct.join(' | '),d);node('p',w.q.e,d)}let b=node('button','Cuba lagi',r);b.onclick=()=>{render();window.scrollTo(0,0)};r.scrollIntoView({behavior:'smooth'});};render();</script></html>
